<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kasoti</title>
<style>:root{--bg:#f4f0ea;--fg:#1d1a17;--card:#fff;--mut:#6b6158;--ac:#d9480f;--ok:#2b8a3e;--no:#c92a2a;--bd:#e4dacd;--skh:#e8590c;--kph:#3b5bdb;--s2:#f1ece5}

.qbox{height:min(44vh,400px);overflow-y:auto;border:2px solid var(--bd);border-radius:16px;padding:4px 14px;background:var(--bg)}.qbox .q{background:var(--card);border:1px solid var(--bd)}.gq{border:2px solid var(--ok)!important}.gname{font-size:1.3rem;font-weight:800}.hq{border-left:6px solid #f59f00}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{min-height:34px;padding:2px 12px;font-size:.9rem;background:var(--card);color:var(--fg);border:2px solid var(--bd);border-radius:99px}
.fxov{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:#000c;overflow:hidden;animation:fade .3s}.fxov canvas{position:absolute;inset:0;pointer-events:none}

.fxe{font-size:5.5rem;line-height:1}.fxw .fxe{animation:spin 1.2s,bounce 1s 1.2s infinite}.fxl .fxe{animation:wob 1.2s infinite}.fxt{font-size:2.8rem;font-weight:900;line-height:1.1;margin:8px 0}.fxw .fxt{color:var(--ok)}.fxl .fxt{color:var(--no)}
.rain{position:absolute;top:-60px;font-size:2.4rem;animation:rain linear infinite}.pop-l,.pop-r{position:absolute;bottom:-10px;font-size:5rem;z-index:3;animation:popper 1.3s ease-out both}.pop-l{left:6%}.pop-r{right:6%;animation-delay:.25s}
@keyframes zoom{from{transform:scale(.3);opacity:0}}@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px) rotate(-2deg)}40%{transform:translateX(14px) rotate(2deg)}60%{transform:translateX(-10px)}80%{transform:translateX(10px)}}@keyframes spin{from{transform:rotate(-360deg) scale(.2)}}@keyframes bounce{50%{transform:translateY(-14px)}}@keyframes wob{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}@keyframes rain{to{transform:translateY(115vh) rotate(360deg)}}@keyframes popper{0%{transform:translateY(40px) scale(.4);opacity:0}30%{opacity:1}60%{transform:translateY(-55vh) rotate(-20deg) scale(1.4)}100%{transform:translateY(-70vh) scale(1.6);opacity:0}}
.alertb{position:fixed;top:84px;left:50%;transform:translateX(-50%);z-index:70;max-width:min(92vw,520px);background:#f59f00;color:#1d1a17;font-weight:800;font-size:1.15rem;padding:14px 20px;border-radius:18px;box-shadow:0 8px 30px #0006;text-align:center;animation:drop .5s cubic-bezier(.2,1.6,.4,1)}
.rxpick{display:flex;gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:4px 10px;margin-top:6px;box-shadow:0 4px 14px #0003;width:max-content;animation:up .15s}.rxpick button{background:none;font-size:1.5rem;min-height:38px;padding:0 4px;color:var(--fg)}
.rb.add{opacity:.55;border-radius:99px}.typing{margin-top:12px;font-weight:600;color:var(--kph)}.typing .dots::after{content:'';animation:dots 1.2s steps(4) infinite}
@keyframes drop{from{transform:translate(-50%,-140%)}}@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.page.dock{max-width:1500px}.gl{display:grid;grid-template-columns:270px minmax(0,1fr) 360px;gap:20px;align-items:start}.gl.noc{grid-template-columns:270px minmax(0,1fr)}
.gl .rost{position:sticky;top:84px;max-height:calc(100vh - 104px);overflow:auto}
.chatdock{position:sticky;top:84px;height:calc(100vh - 104px);display:flex;flex-direction:column;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;box-shadow:0 2px 10px #0000000d}
.fab.on{display:none}.ai .fab,.ai .chatwin{display:none!important}
.a-Unclear{padding:4px 14px;border-radius:99px;background:var(--s2);color:var(--mut);border:2px dashed var(--bd);font-weight:700}
.clue{padding:4px 12px;border-radius:99px;font-weight:700;border:2px solid}.clue.yes{border-color:var(--ok);color:var(--ok)}.clue.no{border-color:var(--no);color:var(--no);text-decoration:line-through}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.seg button{min-height:46px}
.mode{display:flex;align-items:center;gap:16px;text-align:left;width:100%;padding:20px;min-height:92px;border-radius:18px;background:var(--card);color:var(--fg);border:3px solid var(--bd);font-size:1.2rem}.mode:hover{border-color:var(--ac)}.mode.ai{border-color:var(--kph)}.mode small{display:block;font-weight:400;color:var(--mut);font-size:.95rem}.mode .me{font-size:2.6rem}
.facts{text-align:left;margin:14px 0;padding:12px 16px;background:var(--s2);border-radius:14px}.facts p{margin:0 0 8px}.fact{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-top:1px solid var(--bd)}.fact span{color:var(--mut)}.fact b{text-align:right}.fxcard{max-height:92vh;overflow:auto}
@media(max-width:600px){.chatwin{right:0;left:0;bottom:0;width:auto;height:80vh;border-radius:22px 22px 0 0}.fab.on{display:none}h1{font-size:2rem}}
</style></head><body><main id="app"></main>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get=k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}},set=(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}};
let S=null,ws,err='',myname='',tick;
const pre=(location.hash||'').slice(1).toUpperCase();
let home=pre?'join':null;
const fmt=ms=>{const s=Math.ceil(Math.max(0,ms)/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const tx=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));
function conn(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>{try{const o=JSON.parse(sessionStorage.getItem('kgame')||'null');if(o)tx({t:'join',code:o.c,pid:o.p,name:o.n})}catch(e){}};
  ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.t==='peek'){peek=m;err='';return draw()}
    if(m.t==='closed'||m.t==='kicked'||m.t==='left')return resetHome(m.t==='closed'?m.e:m.t==='kicked'?'You were removed from the game by the host.':'')
    if(m.t==='state'){track(S,m);S=m;err='';try{sessionStorage.setItem('kgame',JSON.stringify({c:m.code,p:m.you,n:myname}))}catch(x){}}
    else{err=m.e;scrollTo({top:0,behavior:'smooth'});if(m.gone)try{sessionStorage.removeItem('kgame')}catch(x){}}
    draw()};
  ws.onclose=()=>setTimeout(conn,1500);
}
const goHome=m=>{home=m;err='';peek=null;draw()};
const createGame=()=>{myname=$('#hn').value.trim()||'Host';tx({t:'create',name:myname})};
const aiOpt={topic:'any',country:'both',difficulty:'any',limit:10};
const setOpt=(k,v)=>{aiOpt[k]=v;draw()};
const seg=(k,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button class="${aiOpt[k]===v?'':'g'}" onclick="setOpt('${k}',${typeof v==='number'?v:`'${v}'`})">${l}</button>`).join('')}</div>`;
const createAI=()=>{myname=$('#an').value.trim()||'Player';tx({t:'createai',name:myname,...aiOpt})};
let stick=false;
const useIdea=t=>{const el=$('#qi');if(el&&!el.disabled){el.value=t;el.focus();typing(true)}};
const factsHtml=r=>r.facts?`<div class="facts">${r.info?`<p>${esc(r.info)}</p>`:''}${r.facts.map(([k,v])=>`<div class="fact"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div>`:'';
const IDEAS={start:['Is it a person?','Is it a place?','Is it from India?','Is it from Pakistan?'],
  person:['Is the person alive?','Is it a man?','Is it a woman?','Is he a cricketer?','Is he an actor?','Is he a politician?','Was he born before 1950?','Is he a freedom fighter?','Did he win a Nobel Prize?','Is he a poet or a writer?'],
  place:['Is it natural?','Is it a fort?','Is it a mosque?','Is it a temple?','Is it a tomb?','Is it a mountain?','Is it a city?','Is it a UNESCO World Heritage Site?','Was it built before 1800?','Is it in the north?']};
const qn=q=>String(q).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const EMO=['👍','😂','😮','👏','🔥','❤️'];
let peek=null,pick=null,ctab='g',chatOpen=false,modal=null,seen={g:0,t:0},unread={g:0,t:0},prevRx={},popKeys=new Set(),pendFloat=[];
const findGame=()=>{myname=$('#gn').value.trim();const c=$('#gc').value.trim();if(!myname||!c){err='Enter your name and the game code.';return draw()}err='';pick=null;tx({t:'peek',code:c})};
const doJoin=()=>{if(!pick){err='Pick a team first.';return draw()}err='';tx({t:'join',code:peek.code,name:myname,team:pick})};
const backHome=()=>{peek=null;pick=null;err='';draw()};
const team=(pid,t)=>tx({t:'team',pid,team:t});
const val=id=>$('#'+id).value;
const start=()=>tx({t:'start'});
const saveRules=()=>{tx({t:'rules',asking:val('r_a'),rules:{maxQ:val('r_q'),limit:val('r_l')}});modal=null;draw()};
const saveSecret=()=>{tx({t:'secret',secret:val('sec')});$('#sec').value=''};
const confirmTeam=()=>tx({t:'confirm'});
const HINTS=[['Real person or place?','Try asking whether it is a real person or a place.'],['Which region?','Try asking which continent or region it is connected to.'],['Which era?','Try asking which era or time period it belongs to.'],['Alive / standing today?','Try asking whether it is alive or still standing today.'],['Which field?','Try asking what field it is known for: sports, politics, art, science…']];
const fillHint=(i,k)=>{const el=$('#hr_'+i);if(el)el.value=HINTS[k][1]};
const verdict=(i,ok)=>tx({t:'verdict',i,ok});
let resClosed=false,fxRaf=0;
function sfx(win){try{const a=new (window.AudioContext||window.webkitAudioContext)();(win?[523,659,784,1047]:[392,370,349,294]).forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.type=win?'triangle':'sawtooth';o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(a.destination);o.start(a.currentTime+i*.18);o.stop(a.currentTime+i*.18+.16)})}catch(e){}}
function stopFx(){cancelAnimationFrame(fxRaf);const o=$('#fx');if(o)o.remove()}
const closeFx=()=>{resClosed=true;stopFx()};
function confetti(cv){const c=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;const cols=['#ff6b6b','#ffd43b','#51cf66','#4dabf7','#da77f2','#ff922b'];
  const P=Array.from({length:170},()=>({x:Math.random()*cv.width,y:-Math.random()*cv.height*.7,w:6+Math.random()*8,h:10+Math.random()*10,c:cols[Math.random()*6|0],vy:2+Math.random()*4,vx:-2+Math.random()*4,r:Math.random()*6,vr:-.2+Math.random()*.4}));
  const t0=performance.now();(function f(t){c.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;if(p.y>cv.height&&t-t0<6000){p.y=-20;p.x=Math.random()*cv.width}c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.fillRect(-p.w/2,-p.h/2,p.w,p.h);c.restore()});if(t-t0<9000)fxRaf=requestAnimationFrame(f)})(t0)}
function syncResult(){
  if(!S||S.phase!=='ended'){resClosed=false;if($('#fx'))stopFx();return}
  if(resClosed||$('#fx'))return;
  const r=S.result,mine=S.players.find(p=>p.id===S.you)||{},mt=mine.team,win=!!mt&&mt===r.winner,lose=!!mt&&mt!==r.winner;

    }else{
      page='page wide hasnav';
      if(cdn)m+=`<div class="card cd"><div class="mut">Round ${S.round} starts in</div><div class="num" id="cd">${Math.max(0,Math.ceil((S.cdEnds-Date.now())/1000))}</div><p style="font-size:1.3rem"><b>${mt?(onG?'You are a Seeker 🔍':'You are a Keeper 🎭'):'Get ready'}</b><br><span class="mut">${onG?'Work with your team to find the hidden name.':onA?'Protect the secret. Answer honestly!':''}</span></p>${host?`<div class="row" style="justify-content:center"><button class="lg" onclick="tx({t:'skip'})">Skip ⏭</button>${AI?'':`<button class="g" onclick="tx({t:'cancel'})">Back to lobby</button>`}</div>`:''}</div>`;
      if(play){const now=amAsker?(busy?(AI?'🤖 The AI is thinking…':'⏳ Waiting for the Keepers…'):'🎤 Your turn — ask your next question or make a guess.'):amAns?(busy?'🎭 Answer the pending question or guess.':'Waiting for the Seekers’ next question…'):onG?`🎤 ${esc(nm(S.asker))}'s turn to ask. You're after ${esc(nxt)}. Suggest questions in team chat.`:onA?`${esc(nm(S.answerer))} is answering. Agree on Yes/No in team chat.`:'Watching the round…';
        m+=`<div class="card now"><div>${now}</div><div class="bar"><i style="width:${S.used/R.maxQ*100}%"></i></div><div class="mut" style="font-weight:400">Question ${S.used}/${R.maxQ} · Hints ${hs}/3${AI&&S.aiCat?` · Category: <b>${esc(S.aiCat)}</b>`:''}${AI?'':`<br>🎤 Turn: <b>${esc(nm(S.asker))}</b> · Next: <b>${esc(nxt)}</b>`}</div></div>`;m+=clueCard}
      if(done){const r=S.result,won=mt&&mt===r.winner,lost=mt&&mt!==r.winner,why={time:'Time ran out.',questions:'All questions were used.',host:'The host ended the round.',wrong:'That guess was wrong.'}[r.why]||'';
        m+=`<div class="card res ${won?'win':lost?'lose':''}"><div class="big">${won?'🏆 You Won!':lost?'😔 You Lost':(r.seekers?'🔍 The Seekers win!':'🎭 The Keepers win!')}</div><p style="font-size:1.2rem;margin:12px 0 0">${r.seekers?`<b>${esc(r.by||'The Seekers')}</b> guessed it!`:`The Seekers didn't find it. ${why}`}</p><div class="mut" style="margin-top:14px">${AI?'🤖 The AI’s secret was:':'🎭 The Keepers reveal the answer:'}</div><div class="reveal">${[...r.name].map((c,i)=>`<span style="animation-delay:${i*.07}s">${c===' '?'&nbsp;':esc(c)}</span>`).join('')}</div>${factsHtml(r)}
        ${AI?`<div class="row" style="justify-content:center;margin-top:8px"><button class="lg" onclick="next(false)">▶ Play again</button><button class="g" onclick="tx({t:'leave'})">🏠 Home</button></div>`:host?`<div class="row" style="justify-content:center;margin-top:8px"><button class="lg" onclick="next(false)">New game · swap sides</button><button class="g" onclick="next(true)">New game · shuffle teams</button></div>`:'<p class="mut">Waiting for the host to start a new game…</p>'}</div>`}
      if((play||cdn)&&S.secret)m+=`<div class="card" style="border-left:8px solid var(--kph)">🔒 Secret: ${secView()} <span class="mut">(only the Keepers see this)</span></div>`;
      if(play||done){
        m+=`<div class="card"><h2>Questions &amp; guesses</h2><div id="qb" class="qbox">${S.log.length?S.log.map(logRow).join(''):'<p class="mut" style="padding-top:12px">Nothing yet — the Seekers will start soon.</p>'}</div>${typingLine}</div>`;
        if(play&&amAsker&&onG){const hOk=S.used>=10&&hs<3&&!S.log.some(l=>l.h&&!l.r&&!l.s);m+=`<div class="card"><h2>Your turn</h2><div class="row"><input id="qi" maxlength="160" placeholder="${busy?'Waiting for the Keepers…':'Ask a yes/no question'}"${busy?' disabled':''}><button onclick="ask()"${busy?' disabled':''}>Ask</button></div>${ideasHtml}<div class="row" style="margin-top:14px"><input id="gi" placeholder="Think you know? Type your final guess"${busy?' disabled':''}><button class="y" onclick="guess()"${busy?' disabled':''}>Guess</button></div><div class="row" style="margin-top:16px"><button class="g sm" onclick="tx({t:'hint'})"${hOk?'':' disabled'}>💡 ${S.used<10?`Hints unlock after 10 questions (${S.used}/10)`:`Ask for a hint (${3-hs} left)`}</button>${AI?'':`<button class="g sm" onclick="tx({t:'pass'})"${seekL.length>1?'':' disabled'}>⏭ Pass my turn</button>`}</div><p class="mut" style="margin:10px 0 0">Each Seeker gets one turn, then it moves to the next player. Nothing to ask? Pass your turn. A guess is final: a wrong guess ends the round.</p></div>`}
        if(host&&play)m+=`<div class="card row"><span class="mut" style="flex:1">${AI?'Stuck?':'Host controls'}</span><button class="g sm" onclick="tx({t:'end'})">${AI?'🏳️ Give up':'Reveal &amp; end round'}</button></div>`;
      }
    }
    // side roster for the game phases
    const rc=t=>{const g=t===S.asking,T=TEAM(g),L=mem(t),can=(host||(mt===t&&!g))&&!done&&!AI;
      return `<div class="rc ${T.c}"><div class="rh">${T.e} ${T.n} <span>${L.length}</span></div>${L.map(p=>{const isR=g?S.asker===p.id:S.answerer===p.id;
        return `<div class="rm"><span class="dot"></span><span class="rn">${p.id===S.hostId?'👑 ':''}${esc(p.name)}${p.id===S.you?' (you)':''}</span>${isR?`<span class="badge">${g?'🎤 turn':'🎭 answering'}</span>`:''}${can&&!isR?`<button class="ic"${g&&S.typing?' disabled':''} onclick="tx({t:'role',role:'${g?'asker':'answerer'}',pid:'${p.id}'})">${g?'Give turn':'Set answerer'}</button>`:''}${host&&!AI&&p.id!==S.you?`<button class="ic" title="Remove player" onclick="kick('${p.id}')">✕</button>`:''}</div>`}).join('')||'<div class="mut">Nobody</div>'}</div>`};
    if(isOpen())unread[ctab]=0;
    if(!mt&&ctab==='t')ctab='g';
    const list=ctab==='t'?S.tchat:S.chat;
    const msgs=list.map(x=>{const k=ctab+':'+x.id;return `<div class="m${x.pid===S.you?' me':''}" ondblclick="react('${ctab}',${x.id},'❤️')"><small>${esc(x.by)}</small>${esc(x.text)}<div class="rx">${Object.keys(x.rx).map(em=>{const a=x.rx[em];return `<button class="rb${a.includes(S.you)?' on':''}${popKeys.has(k+':'+em)?' pop':''}" onclick="react('${ctab}',${x.id},'${em}')">${em} ${a.length}</button>`}).join('')}<button class="rb add" title="React" onclick="rxOpen=rxOpen==='${k}'?null:'${k}';draw()">☺</button></div>${rxOpen===k?`<div class="rxpick">${EMO.map(em=>`<button onclick="react('${ctab}',${x.id},'${em}');rxOpen=null">${em}</button>`).join('')}</div>`:''}</div>`}).join('')||'<span class="mut">No messages yet. Say hi 👋</span>';
    const c=`<div class="chead"><div class="tabs"><button class="${ctab==='g'?'':'g'}" onclick="setTab('g')">🌍 Everyone${unread.g?`<i class="bdg">${unread.g}</i>`:''}</button>${mt?`<button class="${ctab==='t'?'':'g'}" onclick="setTab('t')">🔒 My team${unread.t?`<i class="bdg">${unread.t}</i>`:''}</button>`:''}</div><button class="g sm" onclick="toggleChat()" title="Collapse chat">▾</button></div>
      <div class="mut" style="margin-top:8px">${ctab==='t'?'Private — only your team sees this.':'Everyone in the game sees this.'}</div><div id="cb" class="cb">${msgs}</div><div class="row"><input id="ci" maxlength="300" placeholder="${ctab==='t'?'Message your team…':'Message everyone…'}"><button onclick="chat()">Send</button></div>`;
    const tot=unread.g+unread.t;
    const rost=`<aside class="rost"><div class="mut" style="font-weight:700;margin-bottom:8px">👥 PLAYERS · ${S.players.length}</div>${rc(S.asking)}${rc(oth(S.asking))}</aside>`;
    const body=lobby?`<div class="stack">${m}</div>`:dock?`<div class="gl${chatOpen?'':' noc'}">${rost}<div class="stack">${m}</div>${chatOpen?`<aside id="side" class="chatdock">${c}</aside>`:''}</div>`:`<div class="stack">${m}</div>${rost}`;
    if(dock)page='page dock hasnav';
    let mod='';
    if(modal==='invite')mod=`<div class="ov" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Invite players <button class="g sm" onclick="closeModal()">✕</button></h2><p class="mut" style="text-align:center;margin:0">Game code</p><div class="code">${S.code}</div><div class="row"><input id="lk" readonly value="${esc(link())}" onclick="this.select()"><button id="cpy" onclick="copy(this)">Copy link</button></div><div class="row" style="margin-top:12px"><button class="g full" onclick="share()">📤 Share…</button></div><p class="mut">Anyone with the link can join — no account needed.</p></div></div>`;
    if(modal==='rules')mod=`<div class="ov" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Game rules <button class="g sm" onclick="closeModal()">✕</button></h2><div class="stack" style="margin:0"><label>Max questions ${sel('r_q',[[15,15],[20,20]],R.maxQ)}</label><label>Round time (minutes)<input id="r_l" type="number" min="1" max="60" value="${R.limit}"></label><label>The Seekers are<select id="r_a"><option value="A"${S.asking==='A'?' selected':''}>Team A</option><option value="B"${S.asking==='B'?' selected':''}>Team B</option></select></label></div><p class="mut">Hints: 3 per round, unlocked after 10 questions · A guess is final · Seekers take turns, one question each</p><button class="lg full" onclick="saveRules()">Save rules</button></div></div>`;
    if(modal==='menu')mod=`<div class="ov" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Game menu <button class="g sm" onclick="closeModal()">✕</button></h2><div class="stack" style="margin:0"><button class="lg full g" onclick="closeModal();leaveGame()">🚪 Leave game</button>${host&&!AI?`<button class="lg full n" onclick="closeModal();endGame()">🛑 End game for everyone</button>`:''}</div>${host&&!AI?'<p class="mut">Leaving as host also ends the game for everyone.</p>':''}</div></div>`;
    app.innerHTML=`${nav}<div class="${page}">${e}${body}</div>${dock?'':`<div id="side" class="chatwin${chatOpen?' open':''}">${c}</div>`}<button class="fab${chatOpen?' on':''}" onclick="toggleChat()" title="Chat">💬${tot?`<i class="bdg" style="position:absolute;top:-4px;right:-4px;margin:0">${tot}</i>`:''}</button>${mod}`;
    const cb=$('#cb');if(cb)cb.scrollTop=cb.scrollHeight;const qb=$('#qb');if(qb)qb.scrollTop=qNear?qb.scrollHeight:qTop;stick=false;floats();
    document.title=(tot?'('+tot+') ':'')+'Kasoti';
    syncResult();
  }
  for(const k in keep)if($('#'+k))$('#'+k).value=keep[k];
  if(fid&&$('#'+fid)){const el=$('#'+fid);el.focus();try{el.setSelectionRange(fs,fs)}catch(x){}}
}
setInterval(()=>{if(!S)return;timeAlert();const t=$('#t');if(t&&S.phase==='playing'){const ms=S.endsAt-Date.now();t.textContent=fmt(ms);const p=$('#tp');if(p)p.classList.toggle('warn',ms<30000)}const cd=$('#cd');if(cd)cd.textContent=Math.max(0,Math.ceil((S.cdEnds-Date.now())/1000))},300);
draw();conn();
</script></body></html>
